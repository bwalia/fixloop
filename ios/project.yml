name: Fixloop
options:
  bundleIdPrefix: run.fixloop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: PAS2QUVJHC
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Fixloop:
    type: application
    platform: iOS
    sources: [Fixloop]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.fixloop.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fixloop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Fixloop/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [run.fixloop.app.refresh]
        FixloopGitHubClientID: $(FIXLOOP_GITHUB_CLIENT_ID)
  FixloopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FixloopTests]
    dependencies:
      - target: Fixloop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: run.fixloop.app.tests
  FixloopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FixloopUITests]
    dependencies:
      - target: Fixloop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: run.fixloop.app.uitests
        TEST_TARGET_NAME: Fixloop
schemes:
  Fixloop:
    build:
      targets:
        Fixloop: all
        FixloopTests: [test]
        FixloopUITests: [test]
    test:
      targets: [FixloopTests, FixloopUITests]
      environmentVariables:
        SCREENSHOT_DIR: $(SRCROOT)/fastlane/screenshots/en-GB
