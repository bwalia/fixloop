# cargo-deny policy. Run: cargo deny check
#
# Licenses follow the CNCF Allowlist License Policy:
# https://github.com/cncf/foundation/blob/main/policies-guidance/allowed-third-party-license-policy.md
# Anything else needs a CNCF exception before it can be added here.

[graph]
all-features = false
# Check the platforms we ship binaries for. Some crates pull extra
# dependencies only on other targets (e.g. rustls-platform-verifier needs
# webpki-root-certs, CDLA-Permissive-2.0, only on wasm32). When the wasm
# dashboard lands (Phase 6), add wasm32-unknown-unknown here and keep
# reqwest/TLS out of its dependency tree.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
