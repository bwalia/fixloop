[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/bwalia/fixloop"
authors = ["The Fixloop Authors"]

[workspace.dependencies]
# internal
fixloop-core = { path = "crates/fixloop-core" }
fixloop-llm = { path = "crates/fixloop-llm" }
fixloop-scm = { path = "crates/fixloop-scm" }
fixloop-store = { path = "crates/fixloop-store" }
fixloop-agents = { path = "crates/fixloop-agents" }
fixloop-server = { path = "crates/fixloop-server" }

# external
async-trait = "0.1"
axum = "0.8"
getrandom = "0.4"
globset = "0.4"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "aws_lc_rs"] }
open = "5"
regex = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["any", "postgres", "sqlite", "migrate", "runtime-tokio", "tls-rustls-ring-native-roots"] }
subtle = "2"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
figment = { version = "0.10", features = ["env"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = { version = "2.5", features = ["serde"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
