name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <${author_email}>$"; then
              echo "::error::Commit $sha has no Signed-off-by line matching its author ($author_email)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See CONTRIBUTING.md#developer-certificate-of-origin"
            exit 1
          fi
