name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Security problems: please do NOT file them here. See SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "Include the full error and hint text." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: input
    id: version
    attributes: { label: Fixloop version, description: "Output of `fixloop --version`" }
